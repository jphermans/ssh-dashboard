name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: SSH-Dashboard-macOS-arm64
          - os: windows-latest
            rid: win-x64
            artifact: SSH-Dashboard-windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: SSH-Dashboard-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test core
        run: dotnet test dotnet/tests/SshDashboard.Core.Tests/SshDashboard.Core.Tests.csproj -c Release --nologo

      - name: Publish
        run: >
          dotnet publish dotnet/src/SshDashboard.App/SshDashboard.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o out

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent out "SSH-Dashboard-${{ github.ref_name }}-macOS-arm64.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath "SSH-Dashboard-${{ github.ref_name }}-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "SSH-Dashboard-${{ github.ref_name }}-linux-x64.tar.gz" -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/
            SSH-Dashboard-*.zip
            SSH-Dashboard-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SSH-Dashboard-*
          merge-multiple: true
          path: release

      - name: Checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; leaving its assets alone."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "SSH Dashboard ${{ github.ref_name }}" \
            --notes "Automated build for ${{ github.ref_name }}. macOS arm64, Windows x64 and Linux x64." \
            $(find release -maxdepth 1 -type f ! -name 'SHA256SUMS.txt')
