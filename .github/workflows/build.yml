name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: SSH-Dashboard-macOS-arm64
          - os: windows-latest
            rid: win-x64
            artifact: SSH-Dashboard-windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: SSH-Dashboard-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve build label
        id: label
        shell: bash
        run: |
          # github.ref_name is "12/merge" on pull_request runs. A slash is not
          # valid in a file name, which broke the Windows and Linux archives.
          label="$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')"
          label="${label:-local}"
          echo "value=$label" >> "$GITHUB_OUTPUT"
          echo "Build label: $label"

      - name: Test
        run: dotnet test dotnet/SshDashboard.slnx -c Release --nologo

      - name: Publish
        run: >
          dotnet publish dotnet/src/SshDashboard.App/SshDashboard.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o out

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent out "SSH-Dashboard-${{ steps.label.outputs.value }}-macOS-arm64.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath "SSH-Dashboard-${{ steps.label.outputs.value }}-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "SSH-Dashboard-${{ steps.label.outputs.value }}-linux-x64.tar.gz" -C out .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/
            SSH-Dashboard-*.zip
            SSH-Dashboard-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: SSH-Dashboard-*
          merge-multiple: true
          path: release

      - name: Checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -exec sha256sum {} + > "SHA256SUMS-${TAG#v}.txt"
          cp "SHA256SUMS-${TAG#v}.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing its build assets."
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SSH Dashboard $TAG" \
              --notes "Automated build for $TAG. macOS arm64, Windows x64 and Linux x64." \
              release/*
          fi

      # The website and README link to /releases/latest/download/<name>, so each
      # asset also needs a version-free alias or every link dies at the next release.
      - name: Publish stable asset names
        run: |
          cd release
          publish_alias() {
            local suffix="$1" alias="$2" src
            src="$(ls -1 ./*-"$suffix" 2>/dev/null | head -1 || true)"
            if [ -z "$src" ]; then
              echo "No archive matching *-$suffix; skipping $alias"
              return 0
            fi
            cp "$src" "$alias"
            gh release upload "$TAG" "$alias" --clobber --repo "$GITHUB_REPOSITORY"
          }
          publish_alias "macOS-arm64.zip" "SSH-Dashboard-macOS-arm64.zip"
          publish_alias "windows-x64.zip" "SSH-Dashboard-windows-x64.zip"
          publish_alias "linux-x64.tar.gz" "SSH-Dashboard-linux-x64.tar.gz"
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
