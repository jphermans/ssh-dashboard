name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: SSH-Dashboard-macOS-arm64
          - os: windows-latest
            rid: win-x64
            artifact: SSH-Dashboard-windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: SSH-Dashboard-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test core
        run: dotnet test dotnet/tests/SshDashboard.Core.Tests/SshDashboard.Core.Tests.csproj -c Release --nologo

      - name: Publish
        run: >
          dotnet publish dotnet/src/SshDashboard.App/SshDashboard.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error
