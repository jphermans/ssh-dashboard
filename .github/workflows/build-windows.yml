name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run test suite
        env:
          SSHDASH_SKIP_UI: "1"
        run: python -m unittest discover -s tests -v

      - name: Verify the app runs on Windows (source)
        run: python ssh_dashboard.py --check

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Validate the Python installer script
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw launcher\windows\install-python.ps1))
          Write-Host "install-python.ps1 parses"

      - name: Build the native launcher and package
        shell: cmd
        run: packaging\build-windows.bat

      - name: Check the launcher stays small
        shell: pwsh
        run: |
          $size = (Get-Item "SSH Dashboard.exe").Length
          Write-Host ("Launcher size: {0:N0} bytes" -f $size)
          if ($size -gt 300000) { throw "Launcher exceeds 300 KB" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Dashboard-1.0.1-windows-x64
          path: dist/SSH-Dashboard-1.0.1-windows-x64.zip
          if-no-files-found: error
