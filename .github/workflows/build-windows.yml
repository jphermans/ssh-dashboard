name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run test suite
        env:
          SSHDASH_SKIP_UI: "1"
        run: python -m unittest discover -s tests -v

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean packaging/SSHDashboard.spec

      - name: Smoke-test the frozen executable
        shell: pwsh
        run: |
          # A GUI-subsystem exe is not waited on by `&`, so use Start-Process.
          $out = Join-Path $PWD "check-output.txt"
          $err = Join-Path $PWD "check-error.txt"
          $p = Start-Process -FilePath "dist\SSH Dashboard\SSH Dashboard.exe" `
            -ArgumentList "--check" -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out
          if ($p.ExitCode -ne 0) {
            Get-Content $err
            throw "Frozen --check failed with exit code $($p.ExitCode)"
          }

      - name: Zip the build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SSH Dashboard\*" `
            -DestinationPath "SSH-Dashboard-1.0.0-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Dashboard-1.0.0-windows-x64
          path: SSH-Dashboard-1.0.0-windows-x64.zip
          if-no-files-found: error
