name: windows-installer

# Manual only: this workflow is never started by a push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the installer (for example 2.1.14)"
        required: true
        default: "2.1.14"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test dotnet/SshDashboard.slnx -c Release --nologo

      - name: Publish Windows app
        run: >
          dotnet publish dotnet/src/SshDashboard.App/SshDashboard.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o dotnet/dist/win

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "installer\SSH-Dashboard.iss" "/DMyAppVersion=${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem "installer\dist" | Format-Table Name, Length

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $asset = "installer/dist/SSH-Dashboard-$env:VERSION-Setup.exe"
          if (-not (Test-Path $asset)) { throw "Installer not found: $asset" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY `
              --title "SSH Dashboard $env:VERSION" `
              --notes "Windows installer for SSH Dashboard $env:VERSION. Per-user install, no administrator prompt. macOS and Linux builds are attached to the main release."
          }

      # Stable, version-free name so /releases/latest/download/SSH-Dashboard-Setup.exe
      # keeps working after the next release.
      - name: Publish stable installer name
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $stable = "installer/dist/SSH-Dashboard-Setup.exe"
          Copy-Item "installer/dist/SSH-Dashboard-$env:VERSION-Setup.exe" $stable -Force
          gh release upload $tag $stable --clobber --repo $env:GITHUB_REPOSITORY

      - uses: actions/upload-artifact@v4
        with:
          name: SSH-Dashboard-${{ inputs.version }}-windows-installer
          path: installer/dist/SSH-Dashboard-${{ inputs.version }}-Setup.exe
          if-no-files-found: error
          retention-days: 30
